<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Evolution of F1</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="track-container">
    <!-- moved *inside* track-container and will be centered via CSS -->
    <section class="intro">
      <h1>Evolution of F1</h1>
      <p>Experience speed, strategy, and spectacle as you zoom through the track.</p>
    </section>

    <svg id="raceTrack" viewBox="0 0 726 576" preserveAspectRatio="xMidYMid meet">
      <!--① Patterns, gradients & filters (unchanged) -->
      <defs>
        <pattern id="startChecker" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
          <rect x="0" y="0" width="20" height="20" fill="white" />
          <rect x="0" y="0" width="10" height="10" fill="black" />
          <rect x="10" y="10" width="10" height="10" fill="black" />
        </pattern>
        <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2a2a2a" />
          <stop offset="50%" stop-color="#363636" />
          <stop offset="100%" stop-color="#2a2a2a" />
        </linearGradient>
        <filter id="roadShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4" />
        </filter>
      </defs>

      <!--② Track + styling -->
      <path id="trackPath"
        d="M567,97 L439,29 L452,71 L494,105 L465,151 L216,280 L155,206 L90,219 L70,277 L114,382 L60,471 L70,529 L314,539 L678,361 L677,317 Z"
        fill="none" stroke="url(#trackGrad)" stroke-width="40" stroke-linecap="round" filter="url(#roadShadow)" />

      <path
        d="M567,97 L439,29 L452,71 L494,105 L465,151 L216,280 L155,206 L90,219 L70,277 L114,382 L60,471 L70,529 L314,539 L678,361 L677,317 Z"
        fill="none" stroke="#555" stroke-width="4" stroke-linecap="round" />

      <path id="centerLine"
        d="M567,97 L439,29 L452,71 L494,105 L465,151 L216,280 L155,206 L90,219 L70,277 L114,382 L60,471 L70,529 L314,539 L678,361 L677,317 Z"
        fill="none" stroke="rgba(200,200,200,0.4)" stroke-width="4" stroke-dasharray="20,20" />

      <!--③ Start line & car -->
      <rect id="startLine" fill="url(#startChecker)" />
      <circle id="car" cx="567" cy="97" r="10" fill="red" />
    </svg>
  </div>

  <script src="script.js"></script>
</body>

</html>
