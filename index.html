<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>F1 Start‑Line Zoom</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="intro">
    <h1>Start‑Line Zoom Demo</h1>
    <p>Scroll down to zoom into the Vegas start line.</p>
  </section>

  <div id="track-container">
    <svg id="raceTrack" viewBox="0 0 726 576" preserveAspectRatio="xMidYMid meet">
      <!-- Vegas circuit paths -->
      <path id="trackPath"
        d="M567,97 L439,29 L452,71 L494,105 L465,151 L216,280 L155,206 L90,219 L70,277 L114,382 L60,471 L70,529 L314,539 L678,361 L677,317 Z"
        fill="none" stroke="#222" stroke-width="40" stroke-linecap="round" />
      <path id="centerLine"
        d="M567,97 L439,29 L452,71 L494,105 L465,151 L216,280 L155,206 L90,219 L70,277 L114,382 L60,471 L70,529 L314,539 L678,361 L677,317 Z"
        fill="none" stroke="#ccc" stroke-width="4" stroke-dasharray="20,20" opacity="0.6" />
      <!-- red dot marking the start -->
      <circle id="car" cx="567" cy="97" r="10" fill="red" />
    </svg>
  </div>

  <script src="script.js"></script>
</body>

</html>
